services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_DATABASE:-ticogames}
      MYSQL_USER: ${DB_USERNAME:-ticogames}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ticogames}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    env_file:
      - ./.env.example
      - path: ./.env
        required: false
    command:
      - sh
      - -ec
      - |
        composer install --no-interaction --prefer-dist
        composer check-platform-reqs
        php artisan config:clear
        if [ -z "$${APP_KEY:-}" ] && [ ! -s storage/app.key ]; then
          (umask 077; php artisan key:generate --show --no-ansi > storage/app.key)
        fi
        php artisan migrate --force
        php artisan db:seed --force
        exec frankenphp run --config /etc/frankenphp/Caddyfile --adapter caddyfile
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./api:/app
      - api_vendor:/app/vendor
      - api_storage:/app/storage
      - api_uploads:/app/storage/app/public
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/up"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  frontend:
    build:
      context: ./front
    environment:
      API_BASE_URL: ${API_BASE_URL:-}
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10

  proxy:
    build:
      context: ./proxy
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "127.0.0.1:80:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/up"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql_data:
  api_vendor:
  api_storage:
  api_uploads:
