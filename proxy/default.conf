resolver 127.0.0.11 valid=5s ipv6=off;

upstream laravel {
    zone laravel 64k;
    server api:8000 resolve;
}

upstream storefront {
    zone storefront 64k;
    server frontend:80 resolve;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 6m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;

    location ~ ^/(?:(?:api|sanctum|images|storage)(?:/|$)|up$) {
        proxy_pass http://laravel;
    }

    location / {
        proxy_pass http://storefront;
    }
}
