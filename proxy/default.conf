# Resolve os endereços novamente quando o Compose recria os serviços.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream laravel {
    zone laravel 64k;
    server api:8000 resolve;
}

upstream vue {
    zone vue 64k;
    server frontend:80 resolve;
}

server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;

    # Mantém a URI original, inclusive /sanctum/csrf-cookie.
    location ~ ^/(?:(?:api|sanctum|images|storage)(?:/|$)|up$) {
        proxy_pass http://laravel;
    }

    location / {
        proxy_pass http://vue;
    }
}
