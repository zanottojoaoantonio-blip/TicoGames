components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: ticogames-session
      description: 'Cookie HttpOnly gerado pela API; utilize login em vez de preencher manualmente.'
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - customer
            - admin
    Catalog:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        products_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Product:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        category_id:
          type: integer
          minimum: 1
        category:
          $ref: '#/components/schemas/Catalog'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Catalog'
        platform_id:
          type: integer
          minimum: 1
        platform:
          $ref: '#/components/schemas/Catalog'
        genres:
          type: array
          items:
            $ref: '#/components/schemas/Catalog'
        name:
          type: string
        description:
          type: string
        image_path:
          type: string
        price:
          type: string
          pattern: '^\d+\.\d{2}$'
          example: '199.90'
        stock:
          type: integer
          minimum: 0
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Address:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        recipient_name:
          type: string
        postal_code:
          type: string
        street:
          type: string
        number:
          type: string
        complement:
          type: string
        neighborhood:
          type: string
        city:
          type: string
        state:
          type: string
    CartItem:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        product_id:
          type: integer
          minimum: 1
        quantity:
          type: integer
          minimum: 1
        subtotal:
          type: string
          pattern: '^\d+\.\d{2}$'
          example: '199.90'
        product:
          $ref: '#/components/schemas/Product'
    Cart:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        subtotal:
          type: string
          pattern: '^\d+\.\d{2}$'
          example: '199.90'
        shipping_cost:
          type: string
          pattern: '^\d+\.\d{2}$'
          example: '199.90'
        total:
          type: string
          pattern: '^\d+\.\d{2}$'
          example: '199.90'
        warnings:
          type: array
          description: 'Ajustes da fusão explícita ou, no primeiro GET após autenticar, da fusão automática.'
          items:
            type: string
    OrderItem:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        product_id:
          type: integer
          minimum: 1
        product_name:
          type: string
        unit_price:
          type: string
          pattern: '^\d+\.\d{2}$'
          example: '199.90'
        quantity:
          type: integer
          minimum: 1
    Order:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        customer_number:
          type: integer
          minimum: 1
          description: 'Sequência do pedido entre todos os pedidos deste cliente, incluindo cancelados e independentemente do filtro por status. O id continua sendo usado nas rotas.'
        user_id:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
            - pending_payment
            - paid
            - shipped
            - delivered
            - cancelled
        total:
          type: string
          pattern: '^\d+\.\d{2}$'
          example: '199.90'
        shipping_cost:
          type: string
          pattern: '^\d+\.\d{2}$'
          example: '199.90'
        created_at:
          type: string
          format: date-time
        paid_at:
          type: string
          format: date-time
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        shipping_recipient_name:
          type: string
        shipping_postal_code:
          type: string
        shipping_street:
          type: string
        shipping_number:
          type: string
        shipping_complement:
          type: string
        shipping_neighborhood:
          type: string
