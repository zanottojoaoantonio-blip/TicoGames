openapi: 3.0.3
info:
  title: 'TicoGames API'
  version: 1.1.0
  description: 'Autenticação por cookies Sanctum. Execute GET /sanctum/csrf-cookie antes de escrever. O Swagger envia X-XSRF-TOKEN automaticamente. Use esta página pela mesma origem do frontend configurada no Sanctum. Login e cadastro fundem o carrinho visitante no AuthService; GET /api/cart já retorna o carrinho da conta. Checkout vazio retorna 422. Frete gratuito. Cliente e administrador cancelam somente pedidos em pending_payment; pedidos pagos, enviados ou entregues não podem ser cancelados.'
servers:
  -
    url: /
paths:
  /sanctum/csrf-cookie:
    get:
      tags:
        - Público
      summary: 'Inicializar sessão e cookie XSRF-TOKEN'
      responses:
        204:
          description: 'Operação concluída'
        401:
          description: 'Sessão autenticada necessária'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        403:
          description: 'Acesso negado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: 'Não encontrado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        409:
          description: 'Conflito com estoque ou estado atual'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        419:
          description: 'Sessão/CSRF inválido'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        422:
          description: 'Dados inválidos'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        429:
          description: 'Muitas tentativas'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/login:
    post:
      tags:
        - Público
      summary: 'Entrar, fundir o carrinho visitante e regenerar a sessão'
      description: 'Após validar as credenciais, AuthService consome o carrinho visitante na mesma sessão antes de efetivar o login. GET /api/cart retorna as quantidades somadas e, na primeira consulta, warnings sobre ajustes de estoque. Não exige POST /api/cart/merge. Credenciais inválidas não consomem o visitante. Falha na fusão preserva os carrinhos e não autentica a conta.'
      responses:
        200:
          description: 'Operação concluída'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        401:
          description: 'Sessão autenticada necessária'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        403:
          description: 'Acesso negado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: 'Não encontrado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        409:
          description: 'Conflito com estoque ou estado atual'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        419:
          description: 'Sessão/CSRF inválido'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        422:
          description: 'Dados inválidos'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        429:
          description: 'Muitas tentativas'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: customer@ticogames.test
                password:
                  type: string
                  example: password
              required:
                - email
                - password
  /api/register:
    post:
      tags:
        - Público
      summary: 'Cadastrar cliente, fundir o carrinho visitante e iniciar sessão'
      description: 'Criação da conta e fusão são transacionais. Falha na fusão desfaz o cadastro e preserva o visitante. O token visitante é removido após sucesso. Consulte GET /api/cart para ler itens e warnings, sem chamada adicional de fusão. Cadastro público sempre cria customer.'
      responses:
        201:
